openapi: 3.1.0
info:
  title: AI Health and Hevy Actions
  version: 1.2.0
  description: Private actions for workout, training, and recovery analysis in Asia/Bangkok time.
servers:
  - url: https://wgolwcojpqydgtlfyjko.supabase.co/functions/v1/hevy-actions
security:
  - bearerAuth: []
paths:
  /v1/daily-state:
    get:
      operationId: getDailyHealthState
      summary: Get a compact health and workout state for one Bangkok date
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
          description: Defaults to today in Asia/Bangkok.
      responses:
        "200":
          description: Compact daily health state with freshness and coverage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompactHealthResponse" }
  /v1/health-recap:
    get:
      operationId: getCompactHealthRecap
      summary: Get a compact recovery, sleep, activity, and training recap
      description: Prefer this endpoint for 7-90 day recaps. It returns aggregates rather than raw measurements.
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 90, default: 28 }
      responses:
        "200":
          description: Compact recap designed to stay within GPT Action payload limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompactHealthResponse" }
  /v1/workout-progress:
    get:
      operationId: getCompactWorkoutProgress
      summary: Get aggregate training progress or progress for one exercise
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 365, default: 28 }
        - in: query
          name: exercise
          schema: { type: string }
          description: Optional exercise-name search. Omit for overall training progress.
      responses:
        "200":
          description: Workout progress summary
          content:
            application/json:
              schema: { type: object, properties: { schema_version: { type: string }, generated_at: { type: string, format: date-time }, timezone: { type: string }, period: { type: object, additionalProperties: true }, freshness: { type: object, additionalProperties: true }, coverage: { type: object, additionalProperties: true }, summary: { type: object, additionalProperties: true }, evidence: {}, data_quality: { type: object, additionalProperties: true } }, additionalProperties: true }
  /v1/data-freshness:
    get:
      operationId: checkHealthDataFreshness
      summary: Check the newest available Hevy and Google Health data
      responses:
        "200":
          description: Per-source data freshness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompactHealthResponse" }
  /v1/portal-dashboard:
    get:
      operationId: getPortalDashboard
      summary: Get the private portal dashboard payload in one cached-data request
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        "200":
          description: Health recap, exercise progress, recent workouts, and body measurements
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /recent-workouts:
    get:
      operationId: getRecentWorkouts
      summary: Get recent completed Hevy workouts
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        "200":
          description: Recent workouts in Bangkok time
          content:
            application/json:
              schema: { type: object, properties: { data: {} }, additionalProperties: true }
  /training-summary:
    get:
      operationId: getTrainingSummary
      summary: Summarize workout frequency, sets, volume, duration, and common exercises
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 365, default: 28 }
      responses:
        "200":
          description: Aggregated training summary
          content:
            application/json:
              schema: { type: object, properties: { data: {} }, additionalProperties: true }
  /exercise-progress:
    get:
      operationId: getExerciseProgress
      summary: Get chronological progress for exercises matching a name
      parameters:
        - in: query
          name: query
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 730, default: 180 }
      responses:
        "200":
          description: Exercise session progression
          content:
            application/json:
              schema: { type: object, properties: { data: {} }, additionalProperties: true }
  /recovery-comparison:
    get:
      operationId: compareTrainingAndRecovery
      summary: Retrieve aligned workouts, activity, sleep, HRV, and resting-heart-rate evidence
      description: Analyze associations only. Do not use this endpoint to make a medical diagnosis.
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 90, default: 28 }
      responses:
        "200":
          description: Combined health and training evidence in Bangkok time
          content:
            application/json:
              schema: { type: object, properties: { data: {} }, additionalProperties: true }
  /routines:
    get:
      operationId: listHevyRoutines
      summary: List cached Hevy routines
      responses:
        "200":
          description: Available routines
          content:
            application/json:
              schema: { type: object, properties: { data: {} }, additionalProperties: true }
    post:
      operationId: createHevyRoutine
      summary: Create a reusable training routine in Hevy
      description: Show and confirm the complete routine, exercise order, rest periods, and every planned set first.
      x-openai-isConsequential: true
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineRequest"
      responses:
        "201":
          description: Created routine
          content:
            application/json:
              schema: { type: object, properties: { data: {} }, additionalProperties: true }
  /routines/{routineId}:
    get:
      operationId: getHevyRoutineDetail
      summary: Get a cached routine with exercises and planned sets
      parameters:
        - in: path
          name: routineId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Complete routine
          content:
            application/json:
              schema: { type: object, properties: { data: {} }, additionalProperties: true }
    put:
      operationId: updateHevyRoutine
      summary: Replace a complete Hevy routine
      description: Retrieve the current routine, show the complete replacement, and obtain explicit confirmation first.
      x-openai-isConsequential: true
      parameters:
        - in: path
          name: routineId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineRequest"
      responses:
        "200":
          description: Updated routine
          content:
            application/json:
              schema: { type: object, properties: { data: {} }, additionalProperties: true }
  /exercise-templates:
    get:
      operationId: searchHevyExerciseTemplates
      summary: Search exercise templates and obtain IDs needed for workouts and routines
      parameters:
        - in: query
          name: query
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Matching exercise templates
          content:
            application/json:
              schema: { type: object, properties: { data: {} }, additionalProperties: true }
  /exercise-templates/{exerciseTemplateId}:
    get:
      operationId: getHevyExerciseTemplate
      summary: Get one exercise template
      parameters:
        - in: path
          name: exerciseTemplateId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Exercise template details
          content:
            application/json:
              schema: { type: object, properties: { data: {} }, additionalProperties: true }
  /exercise-history/{exerciseTemplateId}:
    get:
      operationId: getHevyExerciseHistory
      summary: Get Hevy exercise history for an exercise template
      parameters:
        - in: path
          name: exerciseTemplateId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Exercise history from Hevy
          content:
            application/json:
              schema: { type: object, properties: { data: {} }, additionalProperties: true }
  /body-measurements:
    get:
      operationId: getHevyBodyMeasurements
      summary: Get cached body weight, lean mass, and body-fat measurements
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 365, default: 90 }
      responses:
        "200":
          description: Body measurements in metric units
          content:
            application/json:
              schema: { type: object, properties: { data: {} }, additionalProperties: true }
  /workouts:
    post:
      operationId: createHevyWorkout
      summary: Create a completed workout in Hevy
      description: Confirm all exercises, sets, results, and Bangkok start/end times with the user first.
      x-openai-isConsequential: true
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: A new UUID for this user-approved workout creation.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutRequest"
      responses:
        "201":
          description: Confirmed Hevy workout
          content:
            application/json:
              schema: { type: object, properties: { data: {} }, additionalProperties: true }
  /workouts/{workoutId}:
    get:
      operationId: getHevyWorkoutDetail
      summary: Get a cached workout with every exercise and set
      parameters:
        - in: path
          name: workoutId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Complete workout in Bangkok time
          content:
            application/json:
              schema: { type: object, properties: { data: {} }, additionalProperties: true }
    put:
      operationId: updateHevyWorkout
      summary: Replace an existing Hevy workout
      description: Hevy PUT replaces the workout. Retrieve and confirm complete results before updating.
      x-openai-isConsequential: true
      parameters:
        - in: path
          name: workoutId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutRequest"
      responses:
        "200":
          description: Updated Hevy workout
          content:
            application/json:
              schema: { type: object, properties: { data: {} }, additionalProperties: true }
  /workouts/{workoutId}/physiology:
    get:
      operationId: getWorkoutPhysiology
      summary: Get measured heart rate and calorie evidence for a completed workout
      description: Returns workout physiology plus matched Google Health exercise evidence. Use source-reported workout calories as trend context only, never for calorie-deficit calculations. Never infer exercise-level physiology.
      parameters:
        - in: path
          name: workoutId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Measured workout-level physiology and data coverage
          content:
            application/json:
              schema: { type: object, properties: { data: {} }, additionalProperties: true }
  /sync:
    post:
      operationId: syncHevyNow
      summary: Request an incremental Hevy synchronization
      x-openai-isConsequential: true
      responses:
        "200":
          description: Synchronization result
          content:
            application/json:
              schema: { type: object, properties: { data: {} }, additionalProperties: true }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CompactHealthResponse:
      type: object
      required: [schema_version, generated_at, timezone, period, freshness, coverage, summary, data_quality]
      properties:
        schema_version: { type: string }
        generated_at: { type: string, format: date-time }
        timezone: { type: string }
        period: { type: object, additionalProperties: true }
        freshness: { type: object, additionalProperties: true }
        coverage: { type: object, additionalProperties: true }
        summary: { type: object, additionalProperties: true }
        evidence: {}
        data_quality: { type: object, additionalProperties: true }
    RoutineRequest:
      type: object
      required: [routine]
      properties:
        routine:
          type: object
          required: [title, exercises]
          properties:
            title: { type: string }
            folder_id: { type: integer, nullable: true }
            notes: { type: string }
            exercises:
              type: array
              items:
                type: object
                required: [exercise_template_id, sets]
                properties:
                  exercise_template_id: { type: string }
                  rest_seconds: { type: integer, minimum: 0 }
                  notes: { type: string }
                  superset_id: { type: integer, nullable: true }
                  sets:
                    type: array
                    items:
                      type: object
                      required: [type]
                      properties:
                        type:
                          type: string
                          enum: [normal, warmup, dropset, failure]
                        weight_kg: { type: number, nullable: true }
                        reps: { type: integer, nullable: true }
                        rep_range:
                          type: object
                          nullable: true
                          properties:
                            start: { type: integer, nullable: true }
                            end: { type: integer, nullable: true }
                        distance_meters: { type: number, nullable: true }
                        duration_seconds: { type: integer, nullable: true }
                        custom_metric: { type: number, nullable: true }
                        rpe: { type: number, minimum: 0, maximum: 10, nullable: true }
    WorkoutRequest:
      type: object
      required: [workout]
      properties:
        workout:
          type: object
          required: [title, start_time, end_time, exercises]
          properties:
            title: { type: string }
            description: { type: string }
            start_time:
              type: string
              format: date-time
              description: ISO 8601 time with +07:00 preferred.
            end_time:
              type: string
              format: date-time
              description: ISO 8601 time with +07:00 preferred.
            is_private: { type: boolean }
            exercises:
              type: array
              items:
                type: object
                required: [exercise_template_id, sets]
                properties:
                  exercise_template_id: { type: string }
                  superset_id: { type: integer, nullable: true }
                  notes: { type: string }
                  sets:
                    type: array
                    items:
                      type: object
                      required: [type]
                      properties:
                        type:
                          type: string
                          enum: [normal, warmup, dropset, failure]
                        weight_kg: { type: number, nullable: true }
                        reps: { type: integer, nullable: true }
                        distance_meters: { type: number, nullable: true }
                        duration_seconds: { type: integer, nullable: true }
                        custom_metric: { type: number, nullable: true }
                        rpe: { type: number, minimum: 0, maximum: 10, nullable: true }
